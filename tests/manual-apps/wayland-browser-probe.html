<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UniLume native Wayland browser probe</title>
</head>
<body>
  <label for="probe">UniLume controlled input probe</label>
  <textarea id="probe" autofocus></textarea>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const token = parameters.get("token");
    const probe = document.querySelector("#probe");
    let revision = 0;

    const report = (kind, value, composing = false) => fetch("/report", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        token,
        kind,
        value,
        composing,
        revision: ++revision,
      }),
    });

    probe.addEventListener("input", event => {
      report("visible", probe.value, event.isComposing);
    });
    probe.addEventListener("keydown", event => {
      if (event.key !== "Enter") {
        return;
      }
      event.preventDefault();
      const value = probe.value;
      report("committed", value).then(() => {
        probe.value = "";
        return report("visible", "");
      });
    });
    window.addEventListener("load", () => {
      probe.focus();
      report("visible", "");
    });
  </script>
</body>
</html>
