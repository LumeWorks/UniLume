<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fcitx5 comparison probe</title>
  <style>
    body { font: 18px sans-serif; margin: 2rem; }
    textarea { box-sizing: border-box; height: 50vh; width: 100%; }
  </style>
</head>
<body>
  <label for="probe">Fcitx5 comparison probe</label>
  <textarea id="probe" autofocus></textarea>
  <script>
    const token = new URL(window.location.href).hash.slice(1) || "probe";
    const reportPort = new URL(window.location.href).searchParams.get("reportPort") || "38491";
    const probe = document.querySelector("#probe");
    let revision = 0;
    const report = () => {
      const value = probe.value.replaceAll("\\n", "|");
      // Keep the observed value in the window title so X11 automation can
      // identify the probe. Report through loopback because browsers throttle
      // externally visible title updates and would hide input-method latency.
      document.title = `${token}|RESULT|${value}`;
      fetch(`http://127.0.0.1:${reportPort}/report`, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "text/plain"},
        body: JSON.stringify({token, revision: ++revision, value}),
      }).catch(() => {});
    };
    probe.addEventListener("input", report);
    document.title = `${token}|RESULT|`;
  </script>
</body>
</html>
