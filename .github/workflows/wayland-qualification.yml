# SPDX-License-Identifier: GPL-2.0-or-later

name: Wayland Harness Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-logic:
    name: Harness decision logic
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run qualification harness unit tests
        run: python3 -B tests/wayland/qualify_wayland_compositor_test.py

      - name: Lint the qualification scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck \
            scripts/test/nested_wayland_qualification_session.sh \
            scripts/test/wayland_qualification_session.sh

      - name: Explain the runtime qualification boundary
        run: |
          cat <<'EOF'
          Runtime qualification is intentionally not run on a GitHub-hosted
          nested/headless compositor. Its synthetic injector and UniLume's
          uinput replacement device do not share a real compositor seat, so
          such a run cannot qualify the native Wayland input path.

          Run scripts/test/qualify_wayland_compositor.py in an actual logged-in
          KWin, Mutter, or wlroots Wayland session and retain its JSON evidence.
          See docs/wayland-validation.md.
          EOF
