name: Sanitizers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AddressSanitizer and UndefinedBehaviorSanitizer build
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S . -B build/asan-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNILUME_ENABLE_ASAN=ON \
            -DUNILUME_ENABLE_UBSAN=ON

      - name: Build
        run: cmake --build build/asan-ubsan --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/asan-ubsan --output-on-failure

  tsan:
    name: tsan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ThreadSanitizer build
        run: |
          cmake -S . -B build/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNILUME_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build/tsan --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/tsan --output-on-failure
