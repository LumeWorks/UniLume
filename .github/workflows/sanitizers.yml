name: Sanitizers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cippie
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/dismonjames/cippie/main/scripts/install.sh \
            --output "$RUNNER_TEMP/cippie-install.sh"
          bash "$RUNNER_TEMP/cippie-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with Cippie
        env:
          CC: gcc
          CXX: g++
        run: cippie build --debug

      - name: Test with Cippie
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cippie test --debug

  tsan:
    name: tsan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ThreadSanitizer build
        run: |
          cmake -S . -B build/tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNILUME_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build/tsan --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/tsan --output-on-failure
