# SPDX-License-Identifier: GPL-2.0-or-later

name: Integration Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fcitx5 development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfcitx5core-dev pkg-config

      - name: Install Cippie
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/dismonjames/cippie/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with Cippie
        run: cippie build --debug

      - name: Run deterministic integration tests with Cippie
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cippie test --debug
