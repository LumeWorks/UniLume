# SPDX-License-Identifier: GPL-2.0-or-later

name: Integration Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fcitx5 and metadata development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            gettext \
            fcitx5 \
            fcitx5-modules-dev \
            libfcitx5config-dev \
            libfcitx5core-dev \
            libfcitx5-qt6-dev \
            qt6-base-dev \
            pkg-config

      - name: Install Cippie
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/dismonjames/cippie/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with Cippie
        run: cippie build --debug

      - name: Run deterministic integration tests with Cippie
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: cippie test --debug

      - name: Check localization catalogs
        run: |
          scripts/i18n/update.sh
          git diff --exit-code -- po

      - name: Build and test Fcitx5 addon
        run: |
          cmake -S . -B build/fcitx5 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNILUME_BUILD_FCITX5_ADDON=ON \
            -DUNILUME_BUILD_CONFIG_GUI=ON
          cmake --build build/fcitx5 --parallel 2
          ctest --test-dir build/fcitx5 --output-on-failure
          cmake --install build/fcitx5 \
            --prefix "$RUNNER_TEMP/unilume-config-smoke"
          scripts/test/config_gui_dbus_smoke.sh \
            "$RUNNER_TEMP/unilume-config-smoke"

      - name: Validate desktop metadata
        run: |
          appstreamcli validate --no-net \
            build/fcitx5/src/fcitx5/org.fcitx.Fcitx5.Addon.UniLume.metainfo.xml
          desktop-file-validate \
            data/org.fcitx.Fcitx5.Addon.UniLume.desktop
          desktop-file-validate \
            data/org.unilume.UniLume.Configuration.desktop
