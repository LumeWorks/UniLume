name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build from'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - id: release-tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --generate-notes --title "UniLume $TAG"

  build-deb:
    name: Build Debian packages
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake g++ pkg-config gettext libfcitx5core-dev libfcitx5config-dev fcitx5-modules-dev debhelper dpkg-dev

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          echo "UNILUME_VERSION=${UNILUME_VERSION}" >> "$GITHUB_ENV"
          echo "UNILUME_DEB_VERSION=${UNILUME_VERSION/-/\~}" >> "$GITHUB_ENV"

      - name: Build and Package .deb
        shell: bash
        run: |
          cp -r packaging/debian .
          dpkg-buildpackage -b -uc -us
          mkdir -p dist/packages
          cp ../*.deb dist/packages/

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/packages/*.deb \
            --clobber

  build-rpm:
    name: Build RPM packages
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x86_64]
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        shell: bash
        run: |
          dnf install -y cmake gcc-c++ pkgconfig gettext fcitx5 fcitx5-devel make rpm-build tar

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          UNILUME_RPM_VERSION=$(echo "${UNILUME_VERSION}" | cut -d'-' -f1)
          echo "UNILUME_VERSION=${UNILUME_VERSION}" >> "$GITHUB_ENV"
          echo "UNILUME_RPM_VERSION=${UNILUME_RPM_VERSION}" >> "$GITHUB_ENV"

      - name: Build RPM
        shell: bash
        run: |
          RPM_TOPDIR="$(mktemp -d)"
          mkdir -p "${RPM_TOPDIR}/"{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/rpm/unilume.spec "${RPM_TOPDIR}/SPECS/"
          tar -czf "${RPM_TOPDIR}/SOURCES/unilume-${UNILUME_RPM_VERSION}.tar.gz" \
            --transform "s|^|unilume-${UNILUME_RPM_VERSION}/|" \
            --exclude="./.git" \
            --exclude="./build" \
            --exclude="./.cippie" \
            .
          rpmbuild \
            --define "_topdir ${RPM_TOPDIR}" \
            -ba "${RPM_TOPDIR}/SPECS/unilume.spec"
          mkdir -p dist/packages
          cp "${RPM_TOPDIR}"/RPMS/*/*.rpm dist/packages/

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/packages/*.rpm \
            --clobber

  build-arch:
    name: Build Arch packages
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x86_64]
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        shell: bash
        run: |
          pacman -Syu --noconfirm cmake gcc pkg-config gettext fcitx5 make tar sudo fakeroot debugedit

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          UNILUME_ARCH_VERSION=$(echo "${UNILUME_VERSION}" | sed 's/-//')
          echo "UNILUME_ARCH_VERSION=${UNILUME_ARCH_VERSION}" >> "$GITHUB_ENV"

      - name: Build Arch package
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          mkdir -p packaging/arch/src
          ln -s "$GITHUB_WORKSPACE" "packaging/arch/src/unilume-${UNILUME_ARCH_VERSION}"
          sed -i -e 's|^source=.*|source=()|' -e 's|^sha256sums=.*|sha256sums=()|' packaging/arch/PKGBUILD
          
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "
            cd packaging/arch
            makepkg --syncdeps --noconfirm --force --nosign --holdver
          "
          mkdir -p "$GITHUB_WORKSPACE/dist/packages"
          cp packaging/arch/*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/packages/"

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/packages/*.pkg.tar.zst \
            --clobber

  publish:
    name: Publish packages
    needs: [prepare-release, build-deb, build-rpm, build-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Setup signing
        shell: bash
        run: |
          if [[ -n "${UNILUME_GPG_PRIVATE_KEY:-}" ]]; then
            scripts/release/import-gpg-key.sh
          fi

      - name: Sign packages
        shell: bash
        run: |
          if command -v gpg &>/dev/null && gpg --list-secret-keys &>/dev/null; then
            for dir in dist/packages/*/; do
              scripts/release/sign-all.sh "$dir"
            done
          fi

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if command -v rclone &>/dev/null && [[ -n "${RCLONE_CONFIG:-}" ]]; then
            scripts/release/upload-r2.sh \
              stable dist/packages/deb/ stable/deb/amd64/
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            dist/packages/**/*.{deb,rpm,pkg.tar.zst,tar.zst,asc} \
            --clobber
