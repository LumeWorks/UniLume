name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build from'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: release-tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GH_REPO" --draft --generate-notes --title "UniLume $TAG"

  build-deb:
    name: Build Debian packages
    needs: prepare-release
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 45
    strategy:
      matrix:
        arch: [amd64]
    steps:
      - name: Install checkout prerequisites
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y ca-certificates git

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build deps
        shell: bash
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y \
            build-essential devscripts equivs rsync python3
          apt-get build-dep -y fcitx5

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          echo "UNILUME_VERSION=${UNILUME_VERSION}" >> "$GITHUB_ENV"
          echo "UNILUME_DEB_VERSION=${UNILUME_VERSION/-/\~}" >> "$GITHUB_ENV"

      - name: Build and Package .deb
        shell: bash
        run: |
          scripts/release/build-debian-product.sh dist/packages/deb

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            --repo "$GH_REPO" \
            dist/packages/deb/*.deb \
            dist/packages/deb/SHA256SUMS \
            --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/packages/deb/

  build-rpm:
    name: Build RPM packages
    if: ${{ false }} # Atomic Fcitx RPM packaging is not qualified yet.
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x86_64]
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        shell: bash
        run: |
          dnf install -y cmake gcc-c++ pkgconfig gettext fcitx5 fcitx5-devel make rpm-build tar gh

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          UNILUME_RPM_VERSION=$(echo "${UNILUME_VERSION}" | cut -d'-' -f1)
          echo "UNILUME_VERSION=${UNILUME_VERSION}" >> "$GITHUB_ENV"
          echo "UNILUME_RPM_VERSION=${UNILUME_RPM_VERSION}" >> "$GITHUB_ENV"

      - name: Build RPM
        shell: bash
        run: |
          RPM_TOPDIR="$(mktemp -d)"
          mkdir -p "${RPM_TOPDIR}/"{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/rpm/unilume.spec "${RPM_TOPDIR}/SPECS/"
          tar -czf "${RPM_TOPDIR}/SOURCES/unilume-${UNILUME_RPM_VERSION}.tar.gz" \
            --transform "s|^|unilume-${UNILUME_RPM_VERSION}/|" \
            --exclude="./.git" \
            --exclude="./build" \
            --exclude="./.cippie" \
            .
          rpmbuild \
            --define "_topdir ${RPM_TOPDIR}" \
            -ba "${RPM_TOPDIR}/SPECS/unilume.spec"
          mkdir -p dist/packages
          cp "${RPM_TOPDIR}"/RPMS/*/*.rpm dist/packages/

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            --repo "$GH_REPO" \
            dist/packages/*.rpm \
            --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/packages/*.rpm

  build-arch:
    name: Build Arch packages
    if: ${{ false }} # Atomic Fcitx Arch packaging is not qualified yet.
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        arch: [x86_64]
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build deps
        shell: bash
        run: |
          for i in {1..3}; do
            pacman -Sy --noconfirm archlinux-keyring && \
            pacman -Syu --noconfirm --needed cmake gcc pkg-config gettext fcitx5 make tar sudo fakeroot debugedit github-cli && break || sleep 5
          done

      - name: Get version
        shell: bash
        run: |
          UNILUME_VERSION=$(cmake -P cmake/UniLumeVersion.cmake 2>&1 | sed -n 's/.*UniLume version: //p')
          UNILUME_ARCH_VERSION=$(echo "${UNILUME_VERSION}" | sed 's/-//')
          echo "UNILUME_ARCH_VERSION=${UNILUME_ARCH_VERSION}" >> "$GITHUB_ENV"

      - name: Build Arch package
        shell: bash
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          mkdir -p packaging/arch/src
          ln -s "$GITHUB_WORKSPACE" "packaging/arch/src/unilume-${UNILUME_ARCH_VERSION}"
          sed -i -e 's|^source=.*|source=()|' -e 's|^sha256sums=.*|sha256sums=()|' packaging/arch/PKGBUILD
          
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "
            cd packaging/arch
            makepkg --syncdeps --noconfirm --force --nosign --holdver
          "
          mkdir -p "$GITHUB_WORKSPACE/dist/packages"
          cp packaging/arch/*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/packages/"

      - name: Upload GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            --repo "$GH_REPO" \
            dist/packages/*.pkg.tar.zst \
            --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/packages/*.pkg.tar.zst

  publish:
    name: Publish packages
    needs: [prepare-release, build-deb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/packages

      - name: Setup signing
        shell: bash
        env:
          UNILUME_GPG_PRIVATE_KEY: ${{ secrets.UNILUME_GPG_PRIVATE_KEY }}
          UNILUME_GPG_PASSPHRASE: ${{ secrets.UNILUME_GPG_PASSPHRASE }}
        run: |
          if [[ -z "${UNILUME_GPG_PRIVATE_KEY:-}" ]]; then
            echo "UNILUME_GPG_PRIVATE_KEY is not configured; packages will be unsigned"
            exit 0
          fi
          scripts/release/import-gpg-key.sh

      - name: Sign packages
        shell: bash
        env:
          UNILUME_GPG_PASSPHRASE: ${{ secrets.UNILUME_GPG_PASSPHRASE }}
        run: |
          if [[ -z "${GNUPGHOME:-}" ]]; then
            echo "No GNUPGHOME from Setup signing; skipping package signatures"
            exit 0
          fi
          if ! gpg --list-secret-keys --with-colons --batch 2>/dev/null | grep -q '^sec:'; then
            echo "Error: GNUPGHOME is set but no secret key is available"
            exit 1
          fi
          shopt -s nullglob
          signed_any=0
          for dir in dist/packages/*/; do
            scripts/release/sign-all.sh "$dir"
            package_family=$(basename "$dir")
            if [[ -f "${dir}SHA256SUMS.asc" ]]; then
              mv "${dir}SHA256SUMS.asc" \
                "${dir}${package_family}-SHA256SUMS.asc"
            fi
            signed_any=1
          done
          if [[ "$signed_any" -ne 1 ]]; then
            echo "Error: no package directories found under dist/packages"
            exit 1
          fi

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if command -v rclone &>/dev/null && [[ -n "${RCLONE_CONFIG:-}" ]]; then
            scripts/release/upload-r2.sh \
              stable dist/packages/deb/ stable/deb/amd64/
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' release_assets < <(
            find dist/packages -type f \( \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.pkg.tar.zst' -o \
              -name '*.tar.zst' -o \
              -name '*.asc' \
            \) -print0 | sort -zu
          )
          if [[ "${#release_assets[@]}" -eq 0 ]]; then
            echo "Error: no release assets found under dist/packages"
            exit 1
          fi
          gh release upload "${{ needs.prepare-release.outputs.tag }}" \
            --repo "$GH_REPO" \
            "${release_assets[@]}" \
            --clobber
