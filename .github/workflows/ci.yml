name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
        build_type:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Install Cippie
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/dismonjames/cippie/main/scripts/install.sh \
            --output "$RUNNER_TEMP/cippie-install.sh"
          bash "$RUNNER_TEMP/cippie-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build with Cippie
        shell: bash
        run: |
          BUILD_FLAG=""
          if [[ "${{ matrix.build_type }}" == "Release" ]]; then
            BUILD_FLAG="--release"
          else
            BUILD_FLAG="--debug"
          fi
          cippie build ${BUILD_FLAG}

      - name: Test with Cippie
        shell: bash
        run: |
          BUILD_FLAG=""
          if [[ "${{ matrix.build_type }}" == "Release" ]]; then
            BUILD_FLAG="--release"
          else
            BUILD_FLAG="--debug"
          fi
          cippie test ${BUILD_FLAG}
